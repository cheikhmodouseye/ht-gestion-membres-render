services:
  ht-db:
    image: postgres:16-alpine
    container_name: ht-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ht_gestion
      POSTGRES_USER: ht_app
      POSTGRES_PASSWORD: ${HT_DB_PASSWORD:?HT_DB_PASSWORD manquant}
    volumes:
      - ht_postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ht_app -d ht_gestion"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ht_internal

  ht-api:
    build:
      context: ./server
    container_name: ht-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ht_app:${HT_DB_PASSWORD}@ht-db:5432/ht_gestion
      PORT: 3000
      SESSION_HOURS: 12
      COOKIE_SECURE: ${HT_COOKIE_SECURE:-false}
    depends_on:
      ht-db:
        condition: service_healthy
    networks:
      - ht_internal

  ht-web:
    image: nginx:alpine
    container_name: ht-web-postgres
    restart: unless-stopped
    ports:
      - "${HT_WEB_PORT:-8081}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./deploy/nginx-ovh.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ht-api
    networks:
      - ht_internal

volumes:
  ht_postgres_data:
    name: ht_gestion_postgres

networks:
  ht_internal:
    name: ht_gestion_internal
    driver: bridge
